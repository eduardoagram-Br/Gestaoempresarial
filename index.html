<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2E2117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão Empresarial">
<title>Gestão Empresarial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --cream:#FBF5E9;
    --paper:#FFFCF6;
    --umber:#2E2117;
    --umber-soft:#5A4B3D;
    --line:#E7DCC7;
    --gold:#D9A441;
    --gold-deep:#B9822A;
    --sage:#5C7A4B;
    --sage-soft:#EAF0E4;
    --brick:#C1443B;
    --brick-soft:#FBEAE8;
    --shadow:0 1px 2px rgba(46,33,23,0.06), 0 4px 14px rgba(46,33,23,0.05);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--umber);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--umber);
  }
  .num{ font-variant-numeric: tabular-nums; }
  #app{ display:flex; min-height:100vh; }

  /* Sidebar */
  #sidebar{
    width:216px; flex:0 0 216px;
    background:linear-gradient(180deg,#2E2117,#3A2A1C);
    color:#F1E7D6;
    padding:22px 14px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 22px 8px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:var(--gold); color:#2E2117;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:17px;
  }
  .brand-name{ font-family:'Fraunces',serif; font-size:16.5px; line-height:1.15; font-weight:600; color:#FBF5E9;}
  .brand-sub{ font-size:10.5px; color:#C9B79A; letter-spacing:.03em; }
  nav.navlist{ display:flex; flex-direction:column; gap:2px; margin-top:6px; }
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:9px;
    color:#D9CBB4; font-size:13.5px; font-weight:500;
    cursor:pointer; border:none; background:none; text-align:left; width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .navitem svg{ width:16px; height:16px; flex:0 0 16px; opacity:.85; }
  .navitem:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .navitem.active{ background:var(--gold); color:#2E2117; font-weight:600; }
  .navitem.active svg{ opacity:1; }
  .sidebar-foot{ margin-top:auto; font-size:10.5px; color:#8B7A63; padding:10px 8px 0; }
  .mobile-menu-btn{
    display:none; align-items:center; gap:8px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#F1E7D6;
    padding:9px 14px; border-radius:10px; font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer;
  }
  .mobile-menu-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,14,9,0.55); z-index:80;
  }
  .mobile-menu-overlay.open{ display:block; }
  .mobile-menu-panel{
    position:absolute; top:0; right:0; height:100%; width:82%; max-width:320px;
    background:linear-gradient(180deg,#2E2117,#3A2A1C); color:#F1E7D6;
    padding:20px 16px; overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,0.3);
  }
  .mobile-menu-head{ display:flex; justify-content:space-between; align-items:center; font-family:'Fraunces',serif; font-size:16px; margin-bottom:14px; color:#FBF5E9; }
  .mobile-menu-head .modal-close{ color:#F1E7D6; }
  .mobile-menu-item{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:none; color:#D9CBB4; font-family:'Inter'; font-size:15px; font-weight:600;
    padding:14px 10px; border-radius:10px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .mobile-menu-item svg{ width:19px; height:19px; flex:0 0 19px; opacity:.85; }
  .mobile-menu-item.active{ background:var(--gold); color:#2E2117; }
  .mobile-menu-item.active svg{ opacity:1; }

  /* Main */
  #main{ flex:1; min-width:0; padding:28px 34px 60px; max-width:1180px; }
  .pagehead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .pagehead h1{ font-size:26px; margin:0; }
  .pagehead p{ margin:4px 0 0; color:var(--umber-soft); font-size:13.5px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 16px; border-radius:10px; border:1px solid transparent;
    font-family:'Inter'; font-weight:600; font-size:13.5px; cursor:pointer;
    background:var(--umber); color:#FBF5E9;
  }
  .btn:hover{ background:#1e150e; }
  .btn.gold{ background:var(--gold); color:#2E2117; }
  .btn.gold:hover{ background:var(--gold-deep); }
  .btn.ghost{ background:transparent; color:var(--umber); border-color:var(--line); }
  .btn.ghost:hover{ background:#F1E9D6; }
  .btn.danger{ background:transparent; color:var(--brick); border-color:#EBC7C2; }
  .btn.danger:hover{ background:var(--brick-soft); }
  .btn.sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }

  .grid{ display:grid; gap:16px; }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  .grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:1000px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow);
  }
  .stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--umber-soft); font-weight:600;}
  .stat-value{ font-family:'Fraunces',serif; font-size:26px; margin-top:6px; font-weight:600;}
  .stat-value.small{ font-size:20px;}
  .stat-sub{ font-size:12px; color:var(--umber-soft); margin-top:4px;}
  .pos{ color:var(--sage); }
  .neg{ color:var(--brick); }

  .section-title{ font-size:15px; margin:28px 0 12px; display:flex; align-items:center; justify-content:space-between; }

  table{ width:100%; border-collapse:collapse; font-size:13.3px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--umber-soft); padding:8px 10px; border-bottom:1px solid var(--line); font-weight:600;}
  td{ padding:10px 10px; border-bottom:1px solid #F0E7D3; vertical-align:middle;}
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-variant-numeric: tabular-nums; }
  tr.rowlink{ cursor:pointer; }
  tr.rowlink:hover{ background:#FBF2DE; }

  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .pill.pendente{ background:#FBEAD2; color:#95601A; }
  .pill.producao{ background:#FEF3C7; color:#92400E; }
  .pill.pronto{ background:#DCF3E1; color:#166534; }
  .pill.entregue{ background:#DCE7FB; color:#1E40AF; }
  .pill.pago{ background:var(--sage-soft); color:var(--sage); }
  .pill.cancelado{ background:#F4DEDB; color:#9A2E26; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--umber-soft); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
    font-family:'Inter'; font-size:13.5px; background:var(--paper); color:var(--umber);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold); }
  .rowline{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .rowline3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  .itemrow{ display:grid; grid-template-columns: 2fr 0.7fr 1fr 1fr 30px; gap:8px; align-items:end; margin-bottom:8px;}
  .itemrow input{ padding:8px 9px; border-radius:8px; border:1px solid var(--line); font-size:13px;}
  .iconbtn{ background:none; border:none; color:var(--brick); cursor:pointer; font-size:16px; padding:6px; }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .tabbtn{ padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:12.8px; font-weight:600; color:var(--umber-soft); cursor:pointer;}
  .tabbtn.active{ background:var(--umber); border-color:var(--umber); color:#FBF5E9; }

  .empty{ text-align:center; padding:50px 20px; color:var(--umber-soft); }
  .empty .display{ font-size:18px; margin-bottom:6px; color:var(--umber); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(46,33,23,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{ background:var(--paper); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; padding:26px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--umber-soft); }

  .badge-cat{ display:inline-block; padding:2px 9px; border-radius:7px; background:#EFE3C9; color:#7A5A17; font-size:11.5px; font-weight:600;}

  .receipt{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:22px 24px; font-family:'Inter'; color:#1c140c; }
  .receipt h2{ font-family:'Fraunces',serif; margin:0 0 2px; font-size:20px; }
  .receipt .muted{ color:#6b5c4a; font-size:12.5px; }
  .receipt table{ margin-top:14px; }
  .receipt hr{ border:none; border-top:1px dashed #cbb98f; margin:14px 0; }
  .receipt .totline{ display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0; }
  .receipt .totline.grand{ font-weight:700; font-size:16px; border-top:1px solid #e0d3ae; margin-top:6px; padding-top:8px; }

  /* Responsivo (celular) */
  @media (max-width:780px){
    #app{ flex-direction:column; }
    #sidebar{
      width:100%; flex:0 0 auto; height:auto; position:sticky; top:0; z-index:60;
      padding:10px 10px; flex-direction:row; align-items:center; gap:10px;
    }
    .brand{ padding:0; flex:0 0 auto; }
    .brand-name{ display:none; }
    nav.navlist{ display:none; }
    .mobile-menu-btn{ display:flex; margin-left:auto; }
    .sidebar-foot{ display:none; }
    #main{ padding:16px 14px 50px; max-width:100%; }
    .pagehead{ margin-bottom:16px; }
    .pagehead h1{ font-size:21px; }
    .grid.cols-4, .grid.cols-3, .grid.cols-2{ grid-template-columns:1fr 1fr; }
    .rowline, .rowline3{ grid-template-columns:1fr; }
    .itemrow{ grid-template-columns:1fr 1fr; row-gap:6px; }
    .itemrow input:first-child{ grid-column:1 / -1; }
    .card{ padding:14px 14px; overflow-x:auto; }
    table{ font-size:12.3px; }
    th, td{ padding:8px 7px; }
    .modal{ padding:20px 16px; max-height:92vh; }
    .stat-value{ font-size:21px; }
    .tabs{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .tabbtn{ flex:0 0 auto; }
  }
  @media (max-width:420px){
    .grid.cols-4, .grid.cols-3, .grid.cols-2{ grid-template-columns:1fr; }
  }

  ::placeholder{ color:#B9AC94; }
  @page thermal58{ size:58mm auto; margin:2mm; }
  .print-thermal-content{ page: thermal58; }
  @media print{
    #sidebar, .pagehead, .no-print, .mobile-menu-overlay, .mobile-menu-btn{ display:none !important; }
    #main{ padding:0; max-width:none; }
    body{ background:#fff; zoom:1 !important; }
    #printarea{ display:block !important; }
  }
  #printarea{ display:none; }

  /* Acessibilidade: alto contraste */
  body.alto-contraste{ --cream:#FFFFFF; --paper:#FFFFFF; --umber:#000000; --umber-soft:#000000; --line:#000000; }
  body.alto-contraste .card{ border:2px solid #000; box-shadow:none; }
  body.alto-contraste table th{ border-bottom:2px solid #000; }
  body.alto-contraste table td{ border-bottom:1.5px solid #000; }
  body.alto-contraste .field input, body.alto-contraste .field select, body.alto-contraste .field textarea{ border:2px solid #000; }
  body.alto-contraste ::placeholder{ color:#3a3a3a; }
  body.alto-contraste .btn.ghost{ border:2px solid #000; color:#000; }
  body.alto-contraste .stat-sub{ color:#000; }
</style>
<script>
  function aplicarAcessibilidade(){
    try{
      const escalas = {normal:1, grande:1.2, extra:1.45};
      document.body.style.zoom = escalas[(DATA.config && DATA.config.tamanhoTexto) || 'normal'] || 1;
      document.body.classList.toggle('alto-contraste', !!(DATA.config && DATA.config.altoContraste));
    }catch(e){ /* DATA ainda não carregado */ }
  }
</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">GE</div>
      <div>
        <div class="brand-name">Gestão<br>Empresarial</div>
      </div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
      <span id="mobilePageTitle">Painel</span>
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="sidebar-foot">Gestão de clientes,<br>vendas &amp; financeiro</div>
  </aside>
  <div id="mobileMenuOverlay" class="mobile-menu-overlay" onclick="if(event.target===this) closeMobileMenu()">
    <div class="mobile-menu-panel">
      <div class="mobile-menu-head">
        <span>Menu</span>
        <button class="modal-close" onclick="closeMobileMenu()">✕</button>
      </div>
      <div id="mobileMenuList"></div>
    </div>
  </div>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="printarea"></div>

<script>
/* ============================= DADOS & PERSISTÊNCIA ============================= */
const CATEGORIAS_CUSTO = ["Ingredientes","Embalagens","Gás","Energia","Água","Aluguel","Funcionários","Transporte","Taxas de cartão","Taxas de delivery","Impostos","Manutenção","Marketing","Outros"];
const CATEGORIA_TIPO = {
  "Ingredientes":"variavel","Embalagens":"variavel","Gás":"variavel","Transporte":"variavel",
  "Taxas de cartão":"variavel","Taxas de delivery":"variavel",
  "Energia":"fixo","Água":"fixo","Aluguel":"fixo","Funcionários":"fixo","Impostos":"fixo",
  "Manutenção":"fixo","Marketing":"fixo","Outros":"fixo"
};
const FORMAS_PAGAMENTO = ["Dinheiro","PIX","Cartão de débito","Cartão de crédito","Transferência","Outro"];
const CANAIS = ["Venda direta","WhatsApp","iFood","Delivery próprio","Festa","Evento","Revenda","Outro"];
const STATUS_LIST = ["Pendente","Em produção","Pronto","Entregue","Pago","Cancelado"];
const MOEDAS = {
  BRL:{locale:'pt-BR', code:'BRL', nome:'Real (R$)'},
  USD:{locale:'en-US', code:'USD', nome:'Dólar (US$)'},
  EUR:{locale:'pt-PT', code:'EUR', nome:'Euro (€)'},
  ARS:{locale:'es-AR', code:'ARS', nome:'Peso argentino ($)'},
  MZN:{locale:'pt-PT', code:'MZN', nome:'Metical (MT)'},
};
const IDIOMAS = { pt:'Português', en:'English' };
const APP_NAME = 'Gestão Empresarial';
function moedaAtual(){ return (DATA.config && DATA.config.moeda) || 'BRL'; }
function idiomaAtual(){ return (DATA.config && DATA.config.idioma) || 'pt'; }
function nomeNegocio(){ return (DATA.config && DATA.config.nomeNegocio) || 'Minha Empresa'; }
function iniciaisNegocio(){
  const partes = nomeNegocio().trim().split(/\s+/).filter(Boolean);
  if(partes.length===0) return 'GE';
  if(partes.length===1) return partes[0].slice(0,2).toUpperCase();
  return (partes[0][0]+partes[1][0]).toUpperCase();
}
function slug(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'negocio'; }

let DATA = { clientes: [], vendas: [], custos: [], proximoPedido: 1001, config:{moeda:'BRL', idioma:'pt'} };
let STORAGE_OK = true;
const STORAGE_KEY = 'jackSalgadinhosData';

function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DATA = JSON.parse(raw); }
  }catch(e){ STORAGE_OK=false; }
  ensureShape();
}
function ensureShape(){
  DATA.clientes = DATA.clientes || [];
  DATA.vendas = DATA.vendas || [];
  DATA.custos = DATA.custos || [];
  DATA.custosFixos = DATA.custosFixos || [];
  DATA.concorrentes = DATA.concorrentes || [];
  DATA.custos.forEach(c=>{ if(!c.tipo) c.tipo = CATEGORIA_TIPO[c.categoria] || 'variavel'; });
  DATA.ingredientes = DATA.ingredientes || [];
  DATA.produtos = DATA.produtos || [];
  DATA.proximoPedido = DATA.proximoPedido || 1001;
  DATA.config = DATA.config || {};
  DATA.config.moeda = DATA.config.moeda || 'BRL';
  DATA.config.idioma = DATA.config.idioma || 'pt';
  DATA.config.tamanhoTexto = DATA.config.tamanhoTexto || 'normal';
  DATA.config.altoContraste = DATA.config.altoContraste===undefined ? false : DATA.config.altoContraste;
  if(DATA.config.nomeNegocio===undefined) DATA.config.nomeNegocio = 'Jack Salgadinhos';
  DATA.ingredientes.forEach(i=>{ if(i.estoqueAtual===undefined) i.estoqueAtual=0; if(i.estoqueMinimo===undefined) i.estoqueMinimo=0; });
  DATA.produtos.forEach(p=>{ if(p.estoqueAtual===undefined) p.estoqueAtual=0; if(p.estoqueMinimo===undefined) p.estoqueMinimo=0; });
}
const UNIDADES_INGREDIENTE = ['kg','g','L','ml','unidade'];
function custoUnidadeBaseIngrediente(ing){
  const qtd = parseNum(ing.quantidade)||0;
  return qtd>0 ? (parseNum(ing.precoCompra)||0)/qtd : 0;
}
function custoIngredientesProduto(p){
  return (p.itens||[]).reduce((s,it)=>{
    const ing = DATA.ingredientes.find(i=>i.id===it.ingredienteId);
    if(!ing) return s;
    return s + custoUnidadeBaseIngrediente(ing)*(parseNum(it.quantidade)||0);
  },0);
}
function custoUnitarioProduto(p){
  const rend = parseNum(p.rendimento)||1;
  const base = custoIngredientesProduto(p)/rend;
  return base + (parseNum(p.embalagem)||0) + (parseNum(p.maoDeObra)||0) + (parseNum(p.outros)||0);
}
function precoSugeridoProduto(p){
  const custo = custoUnitarioProduto(p);
  const margem = parseNum(p.margem)||0;
  if(margem>=100) return custo*3;
  return custo/(1-margem/100);
}
function ingredientesUsadosPor(ingredienteId){
  return DATA.produtos.filter(p=>(p.itens||[]).some(it=>it.ingredienteId===ingredienteId));
}
let saveTimer=null;
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    STORAGE_OK = true;
  }catch(e){
    STORAGE_OK = false;
    console.error('Falha ao salvar localmente:', e);
  }
}

/* ============================= HELPERS ============================= */
function brl(n){
  n = parseNum(n);
  const m = MOEDAS[moedaAtual()] || MOEDAS.BRL;
  return n.toLocaleString(m.locale, {style:'currency', currency:m.code});
}
function parseNum(v){
  if(v===undefined || v===null || v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim();
  if(s==='') return 0;
  if(s.indexOf(',')>-1){ s = s.replace(/\./g,'').replace(',', '.'); }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return idiomaAtual()==='en' ? `${m}/${d}/${y}` : `${d}/${m}/${y}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function vendaSubtotal(v){ return (v.itens||[]).reduce((s,it)=>s+ (parseNum(it.qtd)||0)*(parseNum(it.preco)||0),0); }
function vendaCusto(v){ return (v.itens||[]).reduce((s,it)=>s+ (parseNum(it.qtd)||0)*(parseNum(it.custo)||0),0); }
function vendaTotal(v){ return vendaSubtotal(v) - (parseNum(v.desconto)||0) + (parseNum(v.taxa)||0); }
function vendaLucro(v){ return vendaTotal(v) - vendaCusto(v) - (parseNum(v.taxa)||0); }
function vendaQtdItens(v){ return (v.itens||[]).reduce((s,it)=>s+(parseNum(it.qtd)||0),0); }

function inRange(iso, from, to){ return iso>=from && iso<=to; }
function periodRange(period, customFrom, customTo){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let from, to;
  if(period==='hoje'){ from=to=iso(now); }
  else if(period==='semana'){
    const d = new Date(now); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day);
    from = iso(d); to = iso(now);
  } else if(period==='mes'){
    from = iso(new Date(now.getFullYear(), now.getMonth(),1)); to = iso(now);
  } else if(period==='mesAnterior'){
    from = iso(new Date(now.getFullYear(), now.getMonth()-1,1));
    to = iso(new Date(now.getFullYear(), now.getMonth(),0));
  } else if(period==='custom'){
    from = customFrom || iso(new Date(now.getFullYear(),now.getMonth(),1));
    to = customTo || iso(now);
  } else { from='0000-00-00'; to='9999-99-99'; }
  return {from,to};
}

function vendasNoPeriodo(period, customFrom, customTo){
  const {from,to} = periodRange(period, customFrom, customTo);
  return DATA.vendas.filter(v=>inRange(v.data, from, to));
}
function custosNoPeriodo(period, customFrom, customTo){
  const {from,to} = periodRange(period, customFrom, customTo);
  return DATA.custos.filter(c=>inRange(c.data, from, to));
}
function diasNoPeriodo(from, to){
  const d1 = new Date(from+'T00:00:00'), d2 = new Date(to+'T00:00:00');
  return Math.max(1, Math.round((d2-d1)/86400000)+1);
}
function diasNoMesDe(iso){
  const [y,m] = iso.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function totalFixosRecorrentes(){
  return (DATA.custosFixos||[]).filter(c=>c.ativo!==false).reduce((s,c)=>s+parseNum(c.valor),0);
}
function fixosRecorrentesNoPeriodo(from, to){
  const dias = diasNoPeriodo(from, to);
  const diasRef = diasNoMesDe(from);
  return totalFixosRecorrentes() * (dias/diasRef);
}

function resumoCompleto(period, customFrom, customTo){
  const {from,to} = periodRange(period, customFrom, customTo);
  const vendasArr = DATA.vendas.filter(v=>inRange(v.data, from, to));
  const custosArr = DATA.custos.filter(c=>inRange(c.data, from, to));
  const faturamento = vendasArr.reduce((s,v)=>s+vendaSubtotal(v),0);
  const descontos = vendasArr.reduce((s,v)=>s+(parseNum(v.desconto)||0),0);
  const taxas = vendasArr.reduce((s,v)=>s+(parseNum(v.taxa)||0),0);
  const custoProducao = vendasArr.reduce((s,v)=>s+vendaCusto(v),0);
  const custosVar = custosArr.filter(c=>c.tipo!=='fixo').reduce((s,c)=>s+(parseNum(c.valor)||0),0);
  const custosFixosLancados = custosArr.filter(c=>c.tipo==='fixo').reduce((s,c)=>s+(parseNum(c.valor)||0),0);
  const custosFixosRecorrentes = fixosRecorrentesNoPeriodo(from, to);
  const custosFixos = custosFixosLancados + custosFixosRecorrentes;
  const custoTotal = custoProducao + custosVar + custosFixos + taxas;
  const receitaVendas = faturamento - descontos;
  const lucro = receitaVendas - custoProducao - taxas - custosVar - custosFixos;
  const margem = receitaVendas>0 ? (lucro/receitaVendas*100) : 0;
  const pedidos = vendasArr.length;
  const unidades = vendasArr.reduce((s,v)=>s+vendaQtdItens(v),0);
  return {faturamento,descontos,taxas,custoProducao,custosVar,custosFixos,custosFixosRecorrentes,custosFixosLancados,custoTotal,receitaVendas,lucro,margem,pedidos,unidades};
}
function resumoFinanceiro(vendasArr, custosArr){
  const faturamento = vendasArr.reduce((s,v)=>s+vendaSubtotal(v),0);
  const descontos = vendasArr.reduce((s,v)=>s+(parseNum(v.desconto)||0),0);
  const taxas = vendasArr.reduce((s,v)=>s+(parseNum(v.taxa)||0),0);
  const custoProducao = vendasArr.reduce((s,v)=>s+vendaCusto(v),0);
  const custosVar = custosArr.filter(c=>c.tipo!=='fixo').reduce((s,c)=>s+(parseNum(c.valor)||0),0);
  const custosFixos = custosArr.filter(c=>c.tipo==='fixo').reduce((s,c)=>s+(parseNum(c.valor)||0),0);
  const custoTotal = custoProducao + custosVar + custosFixos + taxas;
  const receitaVendas = faturamento - descontos;
  const lucro = receitaVendas - custoProducao - taxas - custosVar - custosFixos;
  const margem = receitaVendas>0 ? (lucro/receitaVendas*100) : 0;
  const pedidos = vendasArr.length;
  const unidades = vendasArr.reduce((s,v)=>s+vendaQtdItens(v),0);
  return {faturamento,descontos,taxas,custoProducao,custosVar,custosFixos,custoTotal,receitaVendas,lucro,margem,pedidos,unidades};
}

function clienteStats(clienteId){
  const vs = DATA.vendas.filter(v=>v.clienteId===clienteId).sort((a,b)=>a.data<b.data?-1:1);
  const totalCompras = vs.length;
  const totalGasto = vs.reduce((s,v)=>s+vendaTotal(v),0);
  const ticketMedio = totalCompras? totalGasto/totalCompras : 0;
  const primeira = vs[0]?.data;
  const ultima = vs[vs.length-1]?.data;
  const lucroGerado = vs.reduce((s,v)=>s+vendaLucro(v),0);
  const produtoCount = {};
  vs.forEach(v=> (v.itens||[]).forEach(it=>{ produtoCount[it.produto]=(produtoCount[it.produto]||0)+(parseNum(it.qtd)||0); }));
  const produtosMaisComprados = Object.entries(produtoCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return {vs,totalCompras,totalGasto,ticketMedio,primeira,ultima,lucroGerado,produtosMaisComprados};
}

function rankingProdutos(vendasArr){
  const map = {};
  vendasArr.forEach(v=>{
    (v.itens||[]).forEach(it=>{
      const key = it.produto || '—';
      if(!map[key]) map[key]={produto:key, qtd:0, faturamento:0, custo:0};
      map[key].qtd += parseNum(it.qtd)||0;
      map[key].faturamento += (parseNum(it.qtd)||0)*(parseNum(it.preco)||0);
      map[key].custo += (parseNum(it.qtd)||0)*(parseNum(it.custo)||0);
    });
  });
  return Object.values(map).map(p=>({...p, lucro:p.faturamento-p.custo, margem: p.faturamento>0?((p.faturamento-p.custo)/p.faturamento*100):0}));
}

function rankingClientes(){
  return DATA.clientes.map(c=>{
    const st = clienteStats(c.id);
    return {...c, ...st};
  });
}

function excluirCliente(id){
  if(!confirm('Excluir este cliente? O histórico de vendas dele permanecerá registrado, mas desvinculado.')) return;
  DATA.clientes = DATA.clientes.filter(c=>c.id!==id);
  DATA.vendas.forEach(v=>{ if(v.clienteId===id){ v.clienteId=null; v.clienteNome = v.clienteNome || '(cliente removido)'; }});
  save(); closeModal(); go('clientes');
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function excluirIngrediente(id){
  const usados = ingredientesUsadosPor(id);

  DATA.ingredientes = DATA.ingredientes.filter(i=>i.id!==id);
  DATA.produtos.forEach(p=>{ p.itens = (p.itens||[]).filter(it=>it.ingredienteId!==id); });
  save(); closeModal(); go('precificacao',{sub:'ingredientes'});
}

function salvarProduto(id){
  const p = produtoDraft;
  if(!p.nome || !p.nome.trim()){ alert('Informe o nome do produto.'); return; }
  if(id){
    const original = DATA.produtos.find(x=>x.id===id);
    Object.assign(original, p);
  } else {
    DATA.produtos.push({id:uid('prod'), ...p});
  }
  save(); produtoDraft=null; closeModal(); go('precificacao',{sub:'produtos'});
}
function excluirProduto(id){
  if(!confirm('Excluir este produto da precificação?')) return;
  DATA.produtos = DATA.produtos.filter(p=>p.id!==id);
  save(); produtoDraft=null; closeModal(); go('precificacao',{sub:'produtos'});
}

function renderEstoque(){
  const sub = ROUTE.params.sub || 'produtos';
  const prodBaixo = DATA.produtos.filter(p=>Number(p.estoqueAtual)<Number(p.estoqueMinimo));
  const ingBaixo = DATA.ingredientes.filter(i=>Number(i.estoqueAtual)<Number(i.estoqueMinimo));
  return `

    <div><h1>Estoque</h1><p>Controle de produtos prontos e matéria-prima.</p></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn ghost" onclick="imprimirEstoque()">Imprimir posição</button>
      <button class="btn ghost" onclick="imprimirFichaContagem()">Imprimir ficha de contagem</button>
      <button class="btn gold" onclick="openProducaoModal()">+ Registrar produção</button>
    </div>
  </div>
  ${(prodBaixo.length+ingBaixo.length)>0 ? `
  <div class="card" style="background:var(--brick-soft); border:none; margin-bottom:20px;">
    <div class="stat-label" style="color:var(--brick);">Itens abaixo do estoque mínimo — o que comprar/produzir</div>
    <table style="margin-top:8px;"><tbody>
      ${prodBaixo.map(p=>`<tr><td>${esc(p.nome)} (produto)</td><td class="num">${p.estoqueAtual} / mín. ${p.estoqueMinimo}</td></tr>`).join('')}
      ${ingBaixo.map(i=>`<tr><td>${esc(i.nome)} (matéria-prima)</td><td class="num">${i.estoqueAtual} / mín. ${i.estoqueMinimo} ${i.unidade}</td></tr>`).join('')}
    </tbody></table>
  </div>` : ''}
  <div class="tabs">
    <button class="tabbtn ${sub==='produtos'?'active':''}" onclick="go('estoque',{sub:'produtos'})">Produtos prontos</button>
    <button class="tabbtn ${sub==='materiaPrima'?'active':''}" onclick="go('estoque',{sub:'materiaPrima'})">Matéria-prima</button>
  </div>
  ${sub==='materiaPrima' ? renderEstoqueIngredientes() : renderEstoqueProdutos()}
  `;
}
function renderEstoqueProdutos(){

  return `<div class="card" style="padding:0;"><table>

let producaoDraft = null;
function openProducaoModal(produtoId){
  if(DATA.produtos.length===0){ alert('Cadastre um produto em Precificação primeiro.'); return; }
  producaoDraft = { produtoId: produtoId || DATA.produtos[0].id, quantidade: 1 };
  renderProducaoModal();
}
function renderProducaoModal(){
  const d = producaoDraft;
  const p = DATA.produtos.find(x=>x.id===d.produtoId);
  const faltando = (p?.itens||[]).map(it=>{
    const ing = DATA.ingredientes.find(i=>i.id===it.ingredienteId);
    if(!ing) return null;
    const necessario = parseNum(it.quantidade) * (parseNum(d.quantidade)/(parseNum(p.rendimento)||1));
    return {nome:ing.nome, necessario, disponivel:Number(ing.estoqueAtual)||0, unidade:ing.unidade, falta: necessario > (Number(ing.estoqueAtual)||0)};
  }).filter(Boolean);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-head"><h2 style="margin:0;">Registrar produção</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="rowline">
        <div class="field"><label>Produto</label><select onchange="producaoDraft.produtoId=this.value; renderProducaoModal();">
          ${DATA.produtos.map(pr=>`<option value="${pr.id}" ${d.produtoId===pr.id?'selected':''}>${esc(pr.nome)}</option>`).join('')}
        </select></div>
        <div class="field"><label>Quantidade produzida (un.)</label><input type="text" inputmode="decimal" value="${d.quantidade}" oninput="producaoDraft.quantidade=this.value; renderProducaoModal();"></div>
      </div>
      ${faltando.length ? `
      <label style="display:block; font-size:12.5px; font-weight:600; color:var(--umber-soft); margin:10px 0 6px;">Consumo de matéria-prima estimado</label>
      <table><tbody>
        ${faltando.map(f=>`<tr><td>${esc(f.nome)}</td><td class="num">${f.necessario.toFixed(2)} ${f.unidade}</td><td class="num" style="color:${f.falta?'var(--brick)':'var(--sage)'}">${f.falta?'estoque insuficiente':'ok'} (${f.disponivel} ${f.unidade} em estoque)</td></tr>`).join('')}
      </tbody></table>` : ''}
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
        <button class="btn ghost" onclick="producaoDraft=null; closeModal();">Cancelar</button>
        <button class="btn gold" onclick="confirmarProducao()">Confirmar produção</button>
      </div>
    </div>
  </div>`;
}
function confirmarProducao(){
  const d = producaoDraft;
  const p = DATA.produtos.find(x=>x.id===d.produtoId);
  const qtd = parseNum(d.quantidade);
  if(!p || qtd<=0){ alert('Informe uma quantidade válida.'); return; }
  (p.itens||[]).forEach(it=>{
    const ing = DATA.ingredientes.find(i=>i.id===it.ingredienteId);
    if(ing){
      const consumo = parseNum(it.quantidade) * (qtd/(parseNum(p.rendimento)||1));
      ing.estoqueAtual = (Number(ing.estoqueAtual)||0) - consumo;
    }
  });
  p.estoqueAtual = (Number(p.estoqueAtual)||0) + qtd;
  save(); producaoDraft=null; closeModal(); go('estoque',{sub:'produtos'});
}

function adicionarItemDoCatalogo(id){
  const p = DATA.produtos.find(x=>x.id===id); if(!p) return;
  const preco = (p.precoPraticado!==undefined && p.precoPraticado!=='' && p.precoPraticado!==null) ? parseNum(p.precoPraticado) : precoSugeridoProduto(p);
  const custo = custoUnitarioProduto(p);
  vendaDraft.itens.push({produto:p.nome, produtoId:p.id, qtd:1, preco: Number(preco.toFixed(2)), custo: Number(custo.toFixed(2))});
  renderMain();
}
function salvarVenda(){
  const v = vendaDraft;
  v.itens = v.itens.filter(it=>it.produto && parseNum(it.qtd)>0);
  if(v.itens.length===0){ alert('Adicione ao menos um item com produto e quantidade.'); return; }
  if(!v.clienteId && !v.clienteNomeAvulso){ if(!confirm('Nenhum cliente selecionado. Registrar como venda avulsa?')) return; }
  const novo = {...v, id:uid('venda')};
  DATA.vendas.push(novo);
  DATA.proximoPedido = Number(DATA.proximoPedido)+1;
  novo.itens.forEach(it=>{
    if(it.produtoId){
      const p = DATA.produtos.find(x=>x.id===it.produtoId);
      if(p){ p.estoqueAtual = (Number(p.estoqueAtual)||0) - parseNum(it.qtd); }
    }
  });
  save();
  vendaDraft = null;
  openNotinha(novo.id);
  go('vendas');
}

function imprimirNotinha(){

}
function imprimirNotinhaTermica(vendaId){
  const v = DATA.vendas.find(x=>x.id===vendaId); if(!v) return;
  const cli = DATA.clientes.find(c=>c.id===v.clienteId);
  const nomeCliente = cli?cli.nome:(v.clienteNomeAvulso||'Cliente avulso');
  const subtotal=vendaSubtotal(v), total=vendaTotal(v);
  const linha = (esq,dir)=>`<div style="display:flex; justify-content:space-between; gap:6px;"><span>${esq}</span><span>${dir}</span></div>`;
  const separador = `<div style="border-top:1px dashed #000; margin:4px 0;"></div>`;
  const itensHtml = (v.itens||[]).map(it=>linha(`${parseNum(it.qtd)}x ${esc(it.produto)}`, brl(parseNum(it.qtd)*parseNum(it.preco)))).join('');
  const html = `
    <div class="print-thermal-content" style="width:54mm; font-family:'Courier New',monospace; font-size:11px; line-height:1.45; padding:2mm; color:#000;">
      <div style="text-align:center; font-weight:700; font-size:12.5px;">${esc(nomeNegocio().toUpperCase())}</div>
      <div style="text-align:center; font-size:10px;">Pedido #${v.numero} — ${fmtDate(v.data)}</div>
      ${separador}
      <div>Cliente: ${esc(nomeCliente)}</div>
      ${separador}
      ${itensHtml}
      ${separador}
      ${linha('Subtotal', brl(subtotal))}
      ${parseNum(v.desconto)>0?linha('Desconto', '-'+brl(v.desconto)):''}
      ${parseNum(v.taxa)>0?linha('Taxa', '+'+brl(v.taxa)):''}
      ${separador}
      <div style="display:flex; justify-content:space-between; font-weight:700; font-size:13px;"><span>TOTAL</span><span>${brl(total)}</span></div>
      <div style="margin-top:4px;">Pagamento: ${v.formaPagamento}</div>
      ${separador}
      <div style="text-align:center; font-size:9.5px;">Recibo/comprovante de venda<br>Não é documento fiscal</div>
    </div>`;
  document.getElementById('printarea').innerHTML = html;
  window.print();
}
function textoNotinha(vendaId){
  const v = DATA.vendas.find(x=>x.id===vendaId);
  const cli = DATA.clientes.find(c=>c.id===v.clienteId);
  const nomeCliente = cli?cli.nome:(v.clienteNomeAvulso||'Cliente avulso');
  let t = `*${nomeNegocio().toUpperCase()}*\nPedido #${v.numero} — ${fmtDate(v.data)}\nCliente: ${nomeCliente}\n\n`;
  (v.itens||[]).forEach(it=>{ t+= `${it.qtd}x ${it.produto} — ${brl((parseNum(it.qtd)||0)*(parseNum(it.preco)||0))}\n`; });
  t += `\nSubtotal: ${brl(vendaSubtotal(v))}\nDesconto: ${brl(v.desconto)}\nTaxas: ${brl(v.taxa)}\n*Total: ${brl(vendaTotal(v))}*\nPagamento: ${v.formaPagamento}`;
  return t;
}
function compartilharNotinha(vendaId){
  const texto = textoNotinha(vendaId);
  if(navigator.share){ navigator.share({title: nomeNegocio() + ' — Notinha', text:texto}).catch(()=>{}); }
  else { navigator.clipboard?.writeText(texto); alert('Notinha copiada para a área de transferência.'); }
}
function whatsappNotinha(vendaId){
  const texto = textoNotinha(vendaId);
  window.open('https://wa.me/?text='+encodeURIComponent(texto), '_blank');
}

        <td style="text-align:right;">
          <button class="btn ghost sm" onclick="openCustoFixoModal('${c.id}')">Editar</button>
        </td>

    </table>
  </div>

  <div class="section-title"><span>Custos variáveis (lançados por período)</span>
    <button class="btn gold sm" onclick="openCustoModal()">+ Novo custo variável</button>

  </div>
  ${f.period==='custom'?`<div class="rowline" style="max-width:420px; margin-bottom:16px;">
    <div class="field"><label>De</label><input type="date" value="${f.from}" onchange="FILTERS.custos.from=this.value; renderMain();"></div>
    <div class="field"><label>Até</label><input type="date" value="${f.to}" onchange="FILTERS.custos.to=this.value; renderMain();"></div>

function excluirConcorrenteItem(concorrenteId, itemId){
  const c = DATA.concorrentes.find(x=>x.id===concorrenteId); if(!c) return;
  if(!confirm('Excluir este item?')) return;
  c.itens = (c.itens||[]).filter(x=>x.id!==itemId);
  save(); closeModal(); go('concorrenteDetalhe',{id:c.id});
}
function renderComparativoConcorrencia(){
  const linhasPorProduto = {};
  DATA.concorrentes.forEach(c=>{
    (c.itens||[]).forEach(it=>{
      if(!it.produtoId) return;
      if(!linhasPorProduto[it.produtoId]) linhasPorProduto[it.produtoId] = [];
      linhasPorProduto[it.produtoId].push({concorrente:c.nome, preco:parseNum(it.preco), data:it.data});
    });
  });
  const produtosComparados = Object.keys(linhasPorProduto);
  return `
  <div class="pagehead"><div><h1>Comparativo com a concorrência</h1><p>Seu preço praticado contra o que os concorrentes cadastrados cobram pelo mesmo item.</p></div>
    <button class="btn ghost" onclick="go('concorrentes')">Voltar</button>
  </div>
  ${produtosComparados.length===0 ? `<div class="card empty"><div class="display">Nenhuma comparação disponível ainda</div>Cadastre itens de concorrentes e vincule a um dos seus produtos para aparecer aqui.</div>` : `
  <div class="card" style="padding:0;">
    <table>
      <thead><tr><th>Seu produto</th><th class="num">Seu preço</th><th>Concorrentes</th><th class="num">Média concorrência</th><th class="num">Diferença</th></tr></thead>
      <tbody>
      ${produtosComparados.map(pid=>{
        const p = DATA.produtos.find(x=>x.id===pid);
        if(!p) return '';
        const meuPreco = (p.precoPraticado!==undefined && p.precoPraticado!=='' && p.precoPraticado!==null) ? parseNum(p.precoPraticado) : precoSugeridoProduto(p);
        const concs = linhasPorProduto[pid];
        const media = concs.reduce((s,c)=>s+c.preco,0)/concs.length;
        const diff = meuPreco - media;
        const diffPct = media>0 ? (diff/media*100) : 0;
        return `<tr>
          <td>${esc(p.nome)}</td>
          <td class="num">${brl(meuPreco)}</td>
          <td>${concs.map(c=>`${esc(c.concorrente)}: ${brl(c.preco)}`).join('<br>')}</td>
          <td class="num">${brl(media)}</td>
          <td class="num" style="font-weight:700; color:${diff>0?'var(--brick)':(diff<0?'var(--sage)':'var(--umber)')}">${diff>0?'+':''}${brl(diff)} (${diffPct>0?'+':''}${diffPct.toFixed(0)}%)</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>
  <p class="stat-sub" style="margin-top:12px;">Diferença positiva = você está mais caro que a média da concorrência. Diferença negativa = você está mais barato.</p>`}
  `;
}

function renderRankings(){

  const sortKey = f.sort;
  prods.sort((a,b)=>b[sortKey]-a[sortKey]);

  const rc = FILTERS.rankCli;
  let clientes = rankingClientes();
  const sortMap = {faturamento:'totalGasto', compras:'totalCompras', recente:'ultima'};
  clientes.sort((a,b)=>{
    const k = sortMap[rc.sort];
    if(k==='ultima') return (b.ultima||'').localeCompare(a.ultima||'');
    return (b[k]||0)-(a[k]||0);
  });

  return `

  </div>

    <button class="tabbtn ${f.sort==='qtd'?'active':''}" onclick="FILTERS.rankProd.sort='qtd'; renderMain();">Ordenar por quantidade</button>

    <button class="tabbtn ${f.sort==='faturamento'?'active':''}" onclick="FILTERS.rankProd.sort='faturamento'; renderMain();">Ordenar por faturamento</button>
  </div>
  ${prods.length===0? `<div class="card empty">Nenhuma venda no período.</div>` : `
  <div class="card" style="padding:0; margin-bottom:28px;">
    <table>
      <thead><tr><th>#</th><th>Produto</th><th class="num">Qtd</th><th class="num">Faturamento</th><th class="num">Custo</th><th class="num">Lucro</th><th class="num">Margem</th></tr></thead>

    </table>
  </div>`}

  <div class="section-title"><span>Melhores clientes</span></div>
  <div class="tabs">
    <button class="tabbtn ${rc.sort==='faturamento'?'active':''}" onclick="FILTERS.rankCli.sort='faturamento'; renderMain();">Maior faturamento</button>
    <button class="tabbtn ${rc.sort==='compras'?'active':''}" onclick="FILTERS.rankCli.sort='compras'; renderMain();">Maior nº de compras</button>
    <button class="tabbtn ${rc.sort==='recente'?'active':''}" onclick="FILTERS.rankCli.sort='recente'; renderMain();">Compra mais recente</button>
  </div>
  ${clientes.length===0? `<div class="card empty">Nenhum cliente cadastrado.</div>` : `
  <div class="card" style="padding:0;">
    <table>
      <thead><tr><th>#</th><th>Nome</th><th class="num">Compras</th><th class="num">Total gasto</th><th class="num">Ticket médio</th><th>Última compra</th></tr></thead>
      <tbody>${clientes.map((c,i)=>`<tr class="rowlink" onclick="go('clienteDetalhe',{id:'${c.id}'})"><td>${i+1}</td><td>${esc(c.nome)}</td><td class="num">${c.totalCompras}</td><td class="num">${brl(c.totalGasto)}</td><td class="num">${brl(c.ticketMedio)}</td><td>${c.ultima?fmtDate(c.ultima):'—'}</td></tr>`).join('')}</tbody>

let CHART_INSTANCES = [];
function last12Months(){
  const arr=[]; const now=new Date();
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  return arr;
}
function renderGraficos(){
  const n = FILTERS.graficos.meses;
  return `
  <div class="pagehead"><div><h1>Gráficos</h1><p>Evolução do negócio ao longo do tempo.</p></div></div>
  <div class="tabs">
    <button class="tabbtn ${n===3?'active':''}" onclick="FILTERS.graficos.meses=3; renderMain();">3 meses</button>
    <button class="tabbtn ${n===6?'active':''}" onclick="FILTERS.graficos.meses=6; renderMain();">6 meses</button>
    <button class="tabbtn ${n===12?'active':''}" onclick="FILTERS.graficos.meses=12; renderMain();">12 meses</button>
  </div>
  <div class="grid cols-2">
    <div class="card"><div class="stat-label">Faturamento por mês</div><canvas id="chFat" height="180"></canvas></div>
    <div class="card"><div class="stat-label">Lucro por mês</div><canvas id="chLucro" height="180"></canvas></div>
    <div class="card"><div class="stat-label">Custos por mês</div><canvas id="chCusto" height="180"></canvas></div>
    <div class="card"><div class="stat-label">Quantidade de pedidos</div><canvas id="chPedidos" height="180"></canvas></div>
    <div class="card"><div class="stat-label">Produtos mais vendidos (unidades)</div><canvas id="chProdQtd" height="180"></canvas></div>
    <div class="card"><div class="stat-label">Produtos mais lucrativos</div><canvas id="chProdLucro" height="180"></canvas></div>
  </div>
  `;
}
function mountGraficos(){
  if(typeof Chart==='undefined'){
    document.querySelectorAll('#main canvas').forEach(c=>{
      c.outerHTML = '<div style="padding:20px 0; text-align:center; color:var(--umber-soft); font-size:13px;">Gráfico indisponível agora — verifique sua conexão com a internet e recarregue a página.</div>';
    });
    return;
  }
  CHART_INSTANCES.forEach(c=>c.destroy()); CHART_INSTANCES=[];
  const n = FILTERS.graficos.meses;
  const meses = last12Months().slice(12-n);
  const labels = meses.map(m=>{ const [y,mm]=m.split('-'); return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][Number(mm)-1]+'/'+y.slice(2); });
  const fat=[], lucro=[], custo=[], pedidos=[];
  meses.forEach(mk=>{
    const primeiroDia = mk+'-01';
    const ultimoDia = mk+'-'+String(diasNoMesDe(primeiroDia)).padStart(2,'0');
    const vs = DATA.vendas.filter(v=>monthKey(v.data)===mk);
    const cs = DATA.custos.filter(c=>monthKey(c.data)===mk);
    const r = resumoFinanceiro(vs,cs);
    r.custosFixos = fixosRecorrentesNoPeriodo(primeiroDia, ultimoDia);
    r.custoTotal = r.custoProducao + r.custosVar + r.custosFixos + r.taxas;
    r.lucro = r.receitaVendas - r.custoProducao - r.taxas - r.custosVar - r.custosFixos;
    fat.push(r.receitaVendas.toFixed(2)); lucro.push(r.lucro.toFixed(2)); custo.push(r.custoTotal.toFixed(2)); pedidos.push(r.pedidos);
  });
  const gold = '#D9A441', sage='#5C7A4B', brick='#C1443B', umber='#2E2117';
  const baseOpts = { responsive:true, plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{grid:{color:'#EFE6D2'}} } };
  CHART_INSTANCES.push(new Chart(document.getElementById('chFat'), {type:'bar', data:{labels, datasets:[{data:fat, backgroundColor:gold, borderRadius:5}]}, options:baseOpts}));
  CHART_INSTANCES.push(new Chart(document.getElementById('chLucro'), {type:'line', data:{labels, datasets:[{data:lucro, borderColor:sage, backgroundColor:'rgba(92,122,75,0.12)', fill:true, tension:.3}]}, options:baseOpts}));
  CHART_INSTANCES.push(new Chart(document.getElementById('chCusto'), {type:'bar', data:{labels, datasets:[{data:custo, backgroundColor:brick, borderRadius:5}]}, options:baseOpts}));
  CHART_INSTANCES.push(new Chart(document.getElementById('chPedidos'), {type:'line', data:{labels, datasets:[{data:pedidos, borderColor:umber, backgroundColor:'rgba(46,33,23,0.08)', fill:true, tension:.3}]}, options:baseOpts}));

  const {from,to} = periodRange('mes');
  const vsMes = DATA.vendas.filter(v=>inRange(v.data,from,to));
  const prods = rankingProdutos(vsMes);
  const topQtd = prods.slice().sort((a,b)=>b.qtd-a.qtd).slice(0,6);
  const topLucro = prods.slice().sort((a,b)=>b.lucro-a.lucro).slice(0,6);
  CHART_INSTANCES.push(new Chart(document.getElementById('chProdQtd'), {type:'bar', data:{labels:topQtd.map(p=>p.produto), datasets:[{data:topQtd.map(p=>p.qtd), backgroundColor:gold, borderRadius:5}]}, options:{...baseOpts, indexAxis:'y'}}));
  CHART_INSTANCES.push(new Chart(document.getElementById('chProdLucro'), {type:'bar', data:{labels:topLucro.map(p=>p.produto), datasets:[{data:topLucro.map(p=>p.lucro.toFixed(2)), backgroundColor:sage, borderRadius:5}]}, options:{...baseOpts, indexAxis:'y'}}));
}

function imprimirControleCaixa(){
  const dias = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
  const colunas = 9; // Data, Abertura, Dinheiro, Cartão, PIX, Outros, Total vendido, Fechamento, Diferença
  const linhaVazia = '<td style="border-bottom:1px solid #ddd; padding:8px 4px;">&nbsp;</td>'.repeat(colunas);
  const linhas = dias.map(d=>`<tr><td style="padding:8px 6px; border-bottom:1px solid #ddd; white-space:nowrap;">${d}</td>${linhaVazia}</tr>`).join('');
  const cabecalhos = ['Dia','Data','Abertura','Dinheiro','Cartão','PIX','Outros','Total vendido','Fechamento','Diferença'];
  const html = `
    <p style="font-size:12.5px; color:#6b5c4a;">Semana de ____/____/______ a ____/____/______</p>
    <table style="width:100%; border-collapse:collapse; font-size:11.5px;">

  `;
  imprimirBloco('Controle de caixa semanal', html);
}
function baixarPlanilhaCaixa(){
  if(typeof XLSX==='undefined'){ alert('Não foi possível carregar a ferramenta de planilha agora. Verifique sua internet e tente de novo.'); return; }
  const dias = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
  const header = ['Dia da semana','Data','Abertura de caixa','Dinheiro','Cartão','PIX','Outros','Total vendido','Fechamento (contado)','Diferença'];
  const aoa = [header];
  for(let s=0; s<5; s++){ dias.forEach(d=> aoa.push([d,'','','','','','','','',''])); }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for(let r=2; r<=aoa.length; r++){
    ws['H'+r] = {t:'n', f:`D${r}+E${r}+F${r}+G${r}`};
    ws['J'+r] = {t:'n', f:`I${r}-(C${r}+H${r})`};
  }
  ws['!cols'] = [{wch:14},{wch:12},{wch:14},{wch:12},{wch:12},{wch:10},{wch:12},{wch:14},{wch:18},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Controle de Caixa');
  XLSX.writeFile(wb, `controle-de-caixa-${slug(nomeNegocio())}.xlsx`);
}
function baixarPlanilhaEstoque(){
  if(typeof XLSX==='undefined'){ alert('Não foi possível carregar a ferramenta de planilha agora. Verifique sua internet e tente de novo.'); return; }
  const hoje = fmtDate(todayISO());
  const headerP = ['Produto','Unidade','Estoque no sistema ('+hoje+')','Contagem manual','Diferença','Data da contagem'];
  const aoaP = [headerP];
  DATA.produtos.forEach(p=> aoaP.push([p.nome, 'un.', Number(p.estoqueAtual)||0, '', '', '']));
  if(DATA.produtos.length===0) aoaP.push(['(cadastre produtos em Precificação)', '', '', '', '', '']);
  const wsP = XLSX.utils.aoa_to_sheet(aoaP);
  for(let r=2; r<=aoaP.length; r++){ if(DATA.produtos.length) wsP['E'+r] = {t:'n', f:`D${r}-C${r}`}; }
  wsP['!cols'] = [{wch:26},{wch:10},{wch:24},{wch:16},{wch:12},{wch:16}];

  const headerI = ['Insumo','Unidade','Estoque no sistema ('+hoje+')','Contagem manual','Diferença','Data da contagem'];
  const aoaI = [headerI];
  DATA.ingredientes.forEach(i=> aoaI.push([i.nome, i.unidade, Number(i.estoqueAtual)||0, '', '', '']));
  if(DATA.ingredientes.length===0) aoaI.push(['(cadastre insumos em Precificação)', '', '', '', '', '']);
  const wsI = XLSX.utils.aoa_to_sheet(aoaI);
  for(let r=2; r<=aoaI.length; r++){ if(DATA.ingredientes.length) wsI['E'+r] = {t:'n', f:`D${r}-C${r}`}; }
  wsI['!cols'] = [{wch:26},{wch:10},{wch:24},{wch:16},{wch:12},{wch:16}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsP, 'Produtos');
  XLSX.utils.book_append_sheet(wb, wsI, 'Materia-prima');
  XLSX.writeFile(wb, `controle-de-estoque-${slug(nomeNegocio())}.xlsx`);
}

function exportarBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-${slug(nomeNegocio())}-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function restaurarBackup(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const novo = JSON.parse(e.target.result);
      if(!confirm('Isso vai substituir todos os dados atuais pelos dados do backup. Continuar?')) return;
      DATA = novo; ensureShape(); save(); go('dashboard');
    }catch(err){ alert('Arquivo inválido. Selecione um backup exportado por este aplicativo.'); }
  };
  reader.readAsText(file);
}

function maskTelefone(v){
  let d = String(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length>10) return d.replace(/(\d{2})(\d{5})(\d{0,4})/, (m,a,b,c)=> c? `(${a}) ${b}-${c}` : `(${a}) ${b}`);
  if(d.length>6) return d.replace(/(\d{2})(\d{4})(\d{0,4})/, (m,a,b,c)=> c? `(${a}) ${b}-${c}` : `(${a}) ${b}`);
  if(d.length>2) return d.replace(/(\d{2})(\d{0,5})/, (m,a,b)=> b? `(${a}) ${b}` : `(${a}`);
  if(d.length>0) return `(${d}`;
  return '';
}
function aplicarMascaraTelefone(el){
  const pos = el.selectionStart;
  const antes = el.value.length;
  el.value = maskTelefone(el.value);
  const depois = el.value.length;
  try{ el.selectionStart = el.selectionEnd = pos + (depois-antes); }catch(e){}
}
const DOMINIOS_EMAIL = ['gmail.com','hotmail.com','outlook.com','yahoo.com.br','icloud.com'];
function atualizarSugestoesEmail(valor){
  const dl = document.getElementById('emailSuggestions');
  if(!dl) return;
  const base = valor.includes('@') ? valor.split('@')[0] : valor;
  if(!base){ dl.innerHTML=''; return; }
  dl.innerHTML = DOMINIOS_EMAIL.map(d=>`<option value="${base}@${d}"></option>`).join('');
}

/* ============================= PWA (instalar como app) ============================= */
function gerarIconeApp(tamanho){
  const c = document.createElement('canvas'); c.width=tamanho; c.height=tamanho;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2E2117'; ctx.fillRect(0,0,tamanho,tamanho);
  ctx.fillStyle = '#D9A441';
  ctx.beginPath(); ctx.arc(tamanho/2, tamanho/2, tamanho*0.42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2E2117';
  ctx.font = `700 ${Math.round(tamanho*0.34)}px Georgia, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(iniciaisNegocio(), tamanho/2, tamanho/2 + tamanho*0.02);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    const icon192 = gerarIconeApp(192);
    const icon512 = gerarIconeApp(512);
    const manifest = {
      name: nomeNegocio() + ' — Gestão',
      short_name: nomeNegocio().slice(0,20),
      start_url: '.',
      display: 'standalone',
      background_color: '#FBF5E9',
      theme_color: '#2E2117',
      icons: [
        {src:icon192, sizes:'192x192', type:'image/png'},
        {src:icon512, sizes:'512x512', type:'image/png'}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const url = URL.createObjectURL(blob);
    let manifestLink = document.querySelector('link[rel="manifest"]');
    if(!manifestLink){ manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
    manifestLink.href = url;
    let touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
    if(!touchIcon){ touchIcon = document.createElement('link'); touchIcon.rel = 'apple-touch-icon'; document.head.appendChild(touchIcon); }
    touchIcon.href = icon192;
  }catch(e){ /* geração de ícone falhou — app continua funcionando normalmente */ }
}

/* ============================= INIT ============================= */
(function init(){
  loadData();
  setupPWA();
  aplicarAcessibilidade();
  render();
})();
</script>
